[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-smash"
version = "0.1.0"
description = "Zero-billing hybrid RAG assistant for GCP and Azure cloud infrastructure documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "httpx>=0.27.2",
    "lxml>=5.3.0",
    "pinecone>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cloud-smash-ingest = "cloud_smash.ingestion.pipeline:main"
cloud-smash-server = "cloud_smash.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
